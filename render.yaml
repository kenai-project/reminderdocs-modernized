# Render Blueprint — ReminderDocs static site
# Creates a Static Site (not a Web Service): no server process needed.
# Deploy with: Render Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    runtime: static
    name: reminderdocs
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      # SPA fallback: serve index.html for client-side routes
      # (/pricing, /contact, /login, /register, /privacy, /terms, / ...)
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Hashed build assets can be cached forever
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
